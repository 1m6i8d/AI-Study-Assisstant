{% extends "base.html" %}
{% block title %}Library · NOTABL{% endblock %}
{% block content %}
<div class="container library-page">
  <h1>Library</h1>
  <div class="subject-grid">
    {% for subject, count in shelf_data %}
      <a href="{{ url_for('library.shelf', subject_id=subject.id) }}" class="subject-card subject-card--{{ subject.color }}">
        <h3>{{ subject.name }}</h3>
        <p class="text-muted">{{ count }} item{{ 's' if count != 1 else '' }}</p>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
